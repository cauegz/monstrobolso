<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monstrobolso</title>
</head>
<body>
    <h1>Monstrobolso</h1>
    <p id="msg">Verificando sessão...</p>
    <button id="sair" hidden>Sair</button>

    <a href="game.html">jogar</a>

    <script type="module">
        import verificarSessao from "./verificarSessao.js";
        verificarSessao();

        const msg = document.getElementById('msg');
        const btnSair = document.getElementById('sair');

        btnSair.addEventListener('click', async () => {
            await fetch('http://localhost:8080/api/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'login.html';
        });

    </script>
</body>
</html>
