<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monstrobolso</title>
</head>
<body>
    <h1>Monstrobolso</h1>
    <p id="msg">Verificando sessão...</p>
    <button id="sair" hidden>Sair</button>

    <script>
        const msg = document.getElementById('msg');
        const btnSair = document.getElementById('sair');

        async function verificarSessao() {
            try {
                const r = await fetch('http://localhost:8080/api/me', { credentials: 'include' });
                const d = await r.json();
                console.log(r)
                console.log(d)
                if (r.ok && d.ok) {
                    msg.textContent = 'Logado como ' + d.nome;
                    btnSair.hidden = false;
                } else {
                    window.location.href = 'login.html';
                }
            } catch (e) {
                console.error(e);
                msg.textContent = 'Não foi possível falar com o servidor.';
            }
        }

        btnSair.addEventListener('click', async () => {
            await fetch('http://localhost:8080/api/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'login.html';
        });

        verificarSessao();
    </script>
</body>
</html>
