<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Team Builder</title>
        <link rel="stylesheet" href="../css/builder.css" />
    </head>
    <body>
        <div id="gameContainer">
            <h1>team builder</h1>
            <div id="equipe">
                <div id="pokemon-1">
                    <button class="btn-selecionar-poke" data-poke="1">
                        Selecionar pokemon 1
                    </button>
                </div>

                <div id="pokemon-2">
                    <button class="btn-selecionar-poke" data-poke="2">
                        Selecionar pokemon 2
                    </button>
                </div>

                <div id="pokemon-3">
                    <button class="btn-selecionar-poke" data-poke="3">
                        Selecionar pokemon 3
                    </button>
                </div>

                <div id="pokemon-4">
                    <button class="btn-selecionar-poke" data-poke="4">
                        Selecionar pokemon 4
                    </button>
                </div>

                <div id="pokemon-5">
                    <button class="btn-selecionar-poke" data-poke="5">
                        Selecionar pokemon 5
                    </button>
                </div>

                <div id="pokemon-6">
                    <button class="btn-selecionar-poke" data-poke="6">
                        Selecionar pokemon 6
                    </button>
                </div>

                <dialog id="selecionar-poke">
                    <button id="fecha-modal">X</button>
                    <div id="pokemons">Carregando...</div>
                </dialog>
            </div>
            <div id="botoes">
              <button id="enviar" onclick="enviar()">
                enviar
              </button>
            </div>
        </div>
        <script src="../js/builder.js"></script>
    </body>
</html>
